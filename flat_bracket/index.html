<!DOCTYPE html>
<html>
<head>
  <title>Flat Bracket Visualization</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; }
    .controls {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .controls button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }
    .controls button:hover { background: #1d4ed8; }
    #bracket {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 52px);
      padding: 8px;
      overflow: auto;
    }
    .team-cell {
      cursor: pointer;
      transition: background 0.15s;
    }
    .team-cell:hover rect {
      fill: #f0f9ff !important;
    }
    .team-cell text.seed-label,
    .team-cell text.logo-fallback {
      fill: #333333;
    }
    .sim-tooltip {
      position: fixed;
      z-index: 1000;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
      pointer-events: none;
      display: none;
      max-width: 220px;
      line-height: 1.4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .sim-tooltip.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="resetBtn">Reset</button>
    <button id="randomBtn">Random</button>
    <button id="simulateBtn">Run 100k Simulations</button>
    <span id="simulateStatus"></span>
    <span>Click a team to advance them. Ctrl+click to gray out all cells for that team (toggle).</span>
  </div>
  <div id="bracket"></div>
  <div id="simTooltip" class="sim-tooltip"></div>

  <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
  <script src="https://d3js.org/queue.v1.min.js"></script>
  <script src="simulation.js"></script>
  <script src="flat_bracket.js"></script>
</body>
</html>
