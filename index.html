<!DOCTYPE html>
<html>
<head>
  <title>Interactive Radial Bracket</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; }
    .controls {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .controls button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }
    .controls button:hover { background: #1d4ed8; }
    #bracket {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 52px);
      padding: 20px;
    }
    path {
      stroke-width: 0.15;
      fill: white;
      stroke: #666;
    }
    .arc { cursor: pointer; }
    .arc:hover path { fill: #f0f9ff !important; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="resetBtn">Reset</button>
    <span>Click a team to advance them to the next round</span>
  </div>
  <div id="bracket"></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
  <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
  <script src="https://d3js.org/queue.v1.min.js"></script>
  <script src="rgbaster.js"></script>
  <script src="bracket.js"></script>
</body>
</html>
